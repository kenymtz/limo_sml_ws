# NAV-OFFLINE-R4-G1 — GENERADA por scripts/nav_offline_lab/make_dwb_r4g1_configs.py. NO ES PRODUCCIÓN.
# = dwb_offline_R4E_015_sim.yaml (sha256 aeeb2772c0bd2f0e…) + GridBased y global_costmap de planner_offline_R3.yaml
#   (global update/publish_frequency 0: arnés síncrono). Para plan_mode=replan_1hz.
map_server:
  ros__parameters: {use_sim_time: false, yaml_filename: '', topic_name: map, frame_id: map_true}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.1,
      movement_time_allowance: 25.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker',
      xy_goal_tolerance: 0.25, yaw_goal_tolerance: 0.25}
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      holonomic: false
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.03
      max_speed_xy: 0.25
      min_speed_theta: 0.1
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign,
        PathDist, GoalDist]
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      ObstacleFootprint.scale: 0.1
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.2, use_astar: false,
      allow_unknown: false}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 0.0
      publish_frequency: 0.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint_padding: 0.02
      footprint: '[[-0.17, -0.16], [-0.17, 0.16], [0.22, 0.16], [0.22, -0.16]]'
      plugins: [static_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 2.0,
        inflation_radius: 0.35}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true,
        enabled: true, subscribe_to_updates: false, transform_tolerance: 0.2}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.02
      track_unknown_space: true
      update_frequency: 0.0
      publish_frequency: 0.0
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[-0.17, -0.16], [-0.17, 0.16], [0.22, 0.16], [0.22, -0.16]]'
      resolution: 0.03
      plugins: [static_layer, inflation_layer]
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true,
        enabled: true, subscribe_to_updates: true, transform_tolerance: 0.1}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', enabled: true,
        inflation_radius: 0.35, cost_scaling_factor: 2.0, inflate_unknown: false,
        inflate_around_unknown: true}
      always_send_full_costmap: true
      introspection_mode: disabled
