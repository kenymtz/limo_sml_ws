# NAV-OFFLINE-R4-A — CONFIG EXPERIMENTAL OFFLINE (GENERADA, no editar a mano).
# Generador: scripts/nav_offline_lab/make_dwb_offline_config.py
# Fuente:    config/navigation/navigation2_real.yaml  sha256=dfb36e108d6872a5b500d3d6df33959203f054330aa2d74051360f41a74ddc62  (NO modificado)
# controller_server: copia literal del real (0 cambios en DWB / critics / límites).
# local_costmap: IDÉNTICO al real (obstacle_layer sin /scan => costmap sin obstáculos).
# Solo para ROS_DOMAIN_ID=99 / ROS_LOCALHOST_ONLY=1. NO usar en el robot.
map_server:
  ros__parameters: {use_sim_time: false, yaml_filename: '', topic_name: map, frame_id: map}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.1,
      movement_time_allowance: 25.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker',
      xy_goal_tolerance: 0.25, yaw_goal_tolerance: 0.25}
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      holonomic: false
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.03
      max_speed_xy: 0.25
      min_speed_theta: 0.1
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.1
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint_padding: 0.02
      footprint: '[[-0.17, -0.16], [-0.17, 0.16], [0.22, 0.16], [0.22, -0.16]]'
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 2.0,
        inflation_radius: 0.35}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan_filtered, obstacle_max_range: 2.5, obstacle_min_range: 0.12,
          raytrace_max_range: 3.0, raytrace_min_range: 0.12, max_obstacle_height: 2.0,
          clearing: true, marking: true, data_type: LaserScan, inf_is_valid: false}
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan: {topic: /scan_filtered, max_obstacle_height: 2.0, clearing: true, marking: true,
          data_type: LaserScan, raytrace_max_range: 3.0, raytrace_min_range: 0.12,
          obstacle_max_range: 2.5, obstacle_min_range: 0.12}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      always_send_full_costmap: true
